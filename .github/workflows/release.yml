name: Build and Publish Wheels

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Semver bump to apply (manual trigger bypasses PR labels)"
        required: true
        type: choice
        default: "patch"
        options:
          - patch
          - minor
          - major

env:
  PYPI_ENVIRONMENT: pypi
  PYTHON_VERSION: "3.12"

permissions:
  contents: write
  id-token: write

jobs:
  # ----------------------------------------------------
  # JOB 1: VERSION BUMP, COMMIT, AND TAG
  # ----------------------------------------------------
  version-bump:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      version_changed: ${{ steps.bump.outputs.version_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install Dependencies for version script
        run: uv pip install --system maturin ".[dev]"

      - name: Determine version increment, Commit, and Tag
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INCREMENT_TYPE="${{ inputs.bump_type }}"
            BRANCH_NAME="manual-dispatch"
            echo "Manual workflow_dispatch trigger"
            echo "Requested increment: $INCREMENT_TYPE"
          else
            PR_NUM=${{ github.event.pull_request.number }}
            BRANCH_NAME=${{ github.event.pull_request.head.ref }}
            LABELS=$(echo '${{ toJSON(github.event.pull_request.labels.*.name) }}' | tr -d '[]"' | sed 's/,/ /g')

            echo "PR #$PR_NUM"
            echo "Branch name: $BRANCH_NAME"
            echo "PR labels: $LABELS"

            INCREMENT_TYPE=""
            if echo "$LABELS" | grep -q "bump:none"; then
              INCREMENT_TYPE=""
            elif echo "$LABELS" | grep -q "bump:major\|bump:release"; then
              INCREMENT_TYPE="major"
            elif echo "$LABELS" | grep -q "bump:minor\|bump:feature"; then
              INCREMENT_TYPE="minor"
            elif echo "$LABELS" | grep -q "bump:patch\|bump:hotfix"; then
              INCREMENT_TYPE="patch"
            fi
          fi

          if [ -z "$INCREMENT_TYPE" ]; then
            echo "No version bump requested, skipping version bump"
            echo "version_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Version increment type: $INCREMENT_TYPE"
          CURRENT_VERSION=$(python scripts/version.py current | cut -d' ' -f3)
          echo "Current version: $CURRENT_VERSION"

          python scripts/version.py $INCREMENT_TYPE
          NEW_VERSION=$(python scripts/version.py current | cut -d' ' -f3)

          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_changed=true" >> $GITHUB_OUTPUT

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add pyproject.toml Cargo.toml python/eo_processor/__init__.py
          git commit -m "chore: bump version to $NEW_VERSION (auto-increment from $BRANCH_NAME branch)"

          git pull --rebase --autostash origin main || (git fetch origin main && git rebase origin/main)

          git push

          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------
  # JOB 2: LINUX WHEELS (manylinux/musllinux via Docker + QEMU)
  # ----------------------------------------------------
  linux-wheels:
    needs: [version-bump]
    if: needs.version-bump.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.version-bump.outputs.new_version }}

      - name: Setup QEMU for ARM builds
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Build manylinux/musllinux wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --sdist
          manylinux: auto

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-wheels
          path: target/wheels

  # ----------------------------------------------------
  # JOB 3: MACOS & WINDOWS WHEELS
  # ----------------------------------------------------
  os-wheels:
    needs: [version-bump]
    if: needs.version-bump.outputs.version_changed == 'true'
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.version-bump.outputs.new_version }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        run: maturin build --release --sdist

      - name: Upload OS Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os }}-wheel-py${{ matrix.python-version }}
          path: target/wheels

  # ----------------------------------------------------
  # JOB 4: PUBLISH TO PYPI
  # ----------------------------------------------------
  pypi-publish:
    runs-on: ubuntu-latest
    needs: [version-bump, linux-wheels, os-wheels]
    if: needs.version-bump.outputs.version_changed == 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/eo-processor/

    steps:
      - uses: actions/checkout@v5

      - name: Download all wheels and sdist
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten artifacts into dist/
        run: find dist -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec mv {} dist/ \;

      - name: Clean up nested directories
        run: find dist -mindepth 1 -type d -exec rm -rf {} + 2>/dev/null || true

      - name: List dist contents
        run: ls -la dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Publish to PyPI
        run: uv publish dist/*.whl dist/*.tar.gz

  # ----------------------------------------------------
  # JOB 5: CREATE GITHUB RELEASE
  # ----------------------------------------------------
  github-release:
    if: needs.version-bump.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    needs: [version-bump, pypi-publish]
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.version-bump.outputs.new_version }}
          name: "Release v${{ needs.version-bump.outputs.new_version }}"
          body: |
            ## Release v${{ needs.version-bump.outputs.new_version }}

            Automated release from merged PR.
          token: ${{ secrets.GITHUB_TOKEN }}